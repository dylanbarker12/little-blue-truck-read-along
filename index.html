<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Blue Truck Read-Along</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Baloo 2",system-ui,sans-serif;background:linear-gradient(#bfe6ff 0 50%,#8fd16a 50%);min-height:100vh;color:#14304f;display:flex;justify-content:center}
main{width:100%;max-width:520px;padding:20px 16px 40px;text-align:center}
h1{font-size:30px;line-height:1.05;margin:2px 0 8px;color:#0a4fa8}
svg.truck{width:min(260px,70vw);height:auto;display:block;margin:0 auto}
.playing .truck{animation:bob .6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.playing .truck{animation:none}}
.page{background:#fff;border-radius:18px;padding:12px 14px;margin:12px 0;box-shadow:0 3px 0 #0003}
.page .num{font-size:15px;opacity:.7}
.page .what{font-size:28px;font-weight:800;color:#0a4fa8;line-height:1.1}
.page .song{font-size:14px;opacity:.7}
.dots{display:flex;justify-content:center;gap:6px;margin-top:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:#cfe0f5}
.dots i.on{background:#1565d8}
button{font:inherit;font-weight:800;border:0;border-radius:18px;cursor:pointer;box-shadow:0 4px 0 #0004;color:#fff}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #0004}
button:focus-visible{outline:3px solid #ffb300;outline-offset:2px}
#next{background:#1565d8;width:100%;min-height:110px;font-size:28px;line-height:1.1}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.row button{min-height:56px;font-size:18px}
#back{background:#78909c}#again{background:#2e7d32}#pause{background:#5c6bc0}
h2{font-size:18px;margin:18px 0 0;text-align:left}
.animals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.animals button{background:#fff;color:#14304f;font-size:14px;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:4px}
.animals button span{font-size:30px;line-height:1}
.animals button.hit{background:#ffe066}
label{display:block;text-align:left;font-weight:600;margin-top:12px;font-size:16px}
input[type=range]{width:100%;height:36px;accent-color:#1565d8}
.note{font-size:13px;margin-top:14px;opacity:.8}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.modes button{background:#fff;color:#14304f;font-size:15px;min-height:60px;line-height:1.1;padding:4px}
.modes button.sel{background:#ffb300;color:#14304f}
.hint{font-size:14px;min-height:20px;margin:4px 0 0}
.mic{display:inline-block;width:10px;height:10px;border-radius:50%;background:#e53935;margin-right:6px;animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.3}}
#secwrap{display:none}
</style>
</head>
<body>
<main id="app">
  <h1>Little Blue Truck's Springtime</h1>
  <svg class="truck" viewBox="0 0 240 140" aria-hidden="true">
    <rect x="20" y="58" width="120" height="44" rx="8" fill="#1e6fe0"/>
    <path d="M140 40h46l28 30v32h-74z" fill="#2b80f0"/>
    <path d="M150 48h32l20 22h-52z" fill="#d9f1ff"/>
    <rect x="20" y="58" width="120" height="8" fill="#5aa2ff"/>
    <circle cx="62" cy="106" r="18" fill="#222"/><circle cx="62" cy="106" r="7" fill="#ccc"/>
    <circle cx="182" cy="106" r="18" fill="#222"/><circle cx="182" cy="106" r="7" fill="#ccc"/>
    <circle cx="211" cy="84" r="5" fill="#ffe066"/>
    <circle cx="40" cy="42" r="9" fill="#ff8fb3"/><circle cx="56" cy="36" r="8" fill="#ffd54f"/><circle cx="72" cy="44" r="9" fill="#ff8fb3"/>
  </svg>
  <div class="page">
    <div class="num" id="num">Cover</div>
    <div class="what" id="what">Ready to roll</div>
    <div class="song" id="song">Tap the big button to start</div>
    <div class="dots" id="dots"></div>
  </div>
  <div class="modes" id="modes">
    <button data-m="voice" class="sel">🎤 Listens to me read</button>
    <button data-m="timer">⏱ Timer</button>
    <button data-m="tap">👆 I'll tap</button>
  </div>
  <div id="secwrap"><label for="secs">Seconds per page: <b id="secv">20</b></label>
  <input id="secs" type="range" min="8" max="45" value="20"></div>
  <p class="hint" id="hint">Say the animal names as you read and the sounds play by themselves.</p>
  <button id="next">▶ Start story</button>
  <div class="row">
    <button id="back">◀ Back</button>
    <button id="again">↻ Again</button>
    <button id="pause">Pause</button>
  </div>
  <h2>Extra taps</h2>
  <div class="animals" id="animals"></div>
  <label for="mvol">Music volume</label>
  <input id="mvol" type="range" min="0" max="100" value="35">
  <label for="bvol">Birds volume</label>
  <input id="bvol" type="range" min="0" max="100" value="25">
  <p class="note">The big button still works in any mode if you want to skip ahead. Streams Epidemic Sound previews, so it needs internet.</p>
</main>
<script>
{
const A="https://audiocdn.epidemicsound.com/lqmp3/";
const S={
  horn:{f:"01KHYF724Q4A46MBZ4M36GF375.mp3",max:2},
  sheep:{f:"01KJAFQ083B68YZ0DMAQE5GH04.mp3",max:4},
  duck:{f:"01KJFC16SG6XMM9SCATCXQK88B.mp3",max:3},
  cow:{f:"01KJ6EXPMPJQRS4FJ4YK4Y1Y6P.mp3",max:3},
  pig:{f:"01KK1DWWEN8045601HKNB7JKZ1.mp3",max:4},
  bunny:{f:"01KHPD8EP07FT8DHW22EP7790Y.mp3",max:2},
  hen:{f:"01KHP52CS97NGNPMH4YJBD6BTQ.mp3",max:3},
  chicks:{f:"01KHP52CK8ZNJ7YSPECEDYJPW6.mp3",max:3},
  toad:{f:"01KK2DJ2301PQ99CTCD7Q48FQ9.mp3",max:3}
};
for(const k in S){const x=new Audio(A+S[k].f);x.preload="auto";S[k].a=x}
const pages=[
  {n:"First page",w:"Beep! Beep!",s:[["horn",0]]},
  {n:"Page 2",w:"Sheep",s:[["sheep",0]],k:["sheep","lamb","baa"]},
  {n:"Page 3",w:"Duck",s:[["duck",0]],k:["duck","quack"]},
  {n:"Page 4",w:"Cow",s:[["cow",0]],k:["cow","calf","moo"]},
  {n:"Page 5",w:"Pig",s:[["pig",0]],k:["pig","oink"]},
  {n:"Page 6",w:"Bunny",k:["bunny","bunnies","rabbit","hop"],s:[["bunny",0],["bunny",900]]},
  {n:"Page 7",w:"Chicken",k:["chicken","chick","hen","peep"],s:[["hen",0],["chicks",2200]]},
  {n:"Last page",w:"The End",k:["beep","the end"],s:[["horn",0]],end:true}
];
const buttons=[["sheep","🐑","Sheep"],["duck","🦆","Duck"],["cow","🐄","Cow"],["pig","🐷","Pig"],["bunny","🐰","Bunny"],["hen","🐔","Chicken"],["toad","🐸","Toad"],["horn","🚚","Beep!"]];
const songs=[
  {t:"Happy Trails",f:"01KJYKZVYSHC3X1E2WCTMFZDNH.mp3"},
  {t:"Between Two Pines",f:"01KJYDD3GE2YCY73XBKSK87MAP.mp3"},
  {t:"Campfire Blues",f:"01KJVY7XANEN5EKXDJ74SEC88X.mp3"}
];
const $=id=>document.getElementById(id);
const music=new Audio(), birds=new Audio(A+"01KJFP3Y19XQ0YSYEDFH6S9J9P.mp3");
birds.loop=true;
let p=-1, si=0, started=false, paused=false, ended=false, duckT;
const mv=()=>$("mvol").value/100, bv=()=>$("bvol").value/100;
const fade=(a,to,ms,done)=>{clearInterval(a._fi);const from=a.volume,st=Date.now();a._fi=setInterval(()=>{const k=Math.min(1,(Date.now()-st)/ms);a.volume=Math.max(0,Math.min(1,from+(to-from)*k));if(k>=1){clearInterval(a._fi);done&&done()}},40)};
const playSong=k=>{si=k%songs.length;music.src=A+songs[si].f;music.volume=0;music.play().then(()=>fade(music,mv(),2500)).catch(()=>{});showSong()};
const showSong=()=>{if(started&&!ended)$("song").textContent="Music: "+songs[si].t};
music.addEventListener("timeupdate",()=>{if(music.duration&&music.duration-music.currentTime<3&&!music._f){music._f=1;fade(music,0,2800)}});
music.addEventListener("playing",()=>{music._f=0});
music.addEventListener("ended",()=>{if(!ended)playSong(si+1)});
const duckMusic=sec=>{if(!started||ended||paused)return;clearTimeout(duckT);fade(music,mv()*0.3,250);duckT=setTimeout(()=>fade(music,mv(),900),sec*1000)};
const sfx=(key,delay)=>setTimeout(()=>{
  const x=S[key].a;x.pause();x.currentTime=0;x.volume=1;x.play().catch(()=>{});
  clearTimeout(x._t);x._t=setTimeout(()=>fade(x,0,400,()=>x.pause()),S[key].max*1000);
},delay);
const playPage=()=>{
  const pg=pages[p];let longest=0;
  pg.s.forEach(([k,d])=>{sfx(k,d);longest=Math.max(longest,d/1000+S[k].max)});
  if(pg.end){
    ended=true;fade(music,0,6000,()=>music.pause());fade(birds,0,6000,()=>birds.pause());
    $("app").classList.remove("playing");$("song").textContent="Thanks for reading!";
  } else duckMusic(longest);
};
let mode="voice",rec=null,listening=false,timerT=null,lastHeard=0;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const hint=t=>{$("hint").innerHTML=t};
$("modes").onclick=ev=>{const b=ev.target.closest("button");if(!b||started)return;mode=b.dataset.m;
  [...$("modes").children].forEach(x=>x.classList.toggle("sel",x===b));
  $("secwrap").style.display=mode==="timer"?"block":"none";
  hint(mode==="voice"?(SR?"Say the animal names as you read and the sounds play by themselves.":"This browser can't listen. Try Chrome, or use Timer."):mode==="timer"?"Pages turn on their own. Set how long you spend on each page.":"Tap the big button each time you turn the page.")};
$("secs").oninput=()=>{$("secv").textContent=$("secs").value};
const advance=()=>{if(p<pages.length-1){p++;render();playPage();if(pages[p].end)stopAuto();else if(mode==="timer")schedule()}};
const schedule=()=>{clearTimeout(timerT);timerT=setTimeout(()=>{if(!paused)advance();else schedule()},$("secs").value*1000)};
const startVoice=()=>{
  if(!SR){hint("This browser can't listen. Switch to Timer or tap.");return}
  rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang="en-US";
  rec.onresult=e=>{
    let txt="";for(let i=e.resultIndex;i<e.results.length;i++)txt+=" "+e.results[i][0].transcript.toLowerCase();
    if(paused||Date.now()-lastHeard<2500)return;
    for(let j=p+1;j<pages.length&&j<=p+2;j++){if(pages[j].end&&j!==p+1)continue;
      if((pages[j].k||[]).some(w=>new RegExp("\\b"+w).test(txt))){lastHeard=Date.now();p=j-1;advance();try{rec.abort()}catch(_){}return}
    }
  };
  rec.onend=()=>{if(listening)setTimeout(()=>{try{rec.start()}catch(_){}},250)};
  rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){listening=false;hint("Microphone blocked. Allow it in your browser settings, or use Timer.")}};
  listening=true;try{rec.start()}catch(_){}
  hint('<span class="mic"></span>Listening. Read along and the animals will join in.');
};
const stopAuto=()=>{clearTimeout(timerT);listening=false;if(rec){try{rec.abort()}catch(_){}}if(mode!=="tap")hint("The End. Tap the big button to read it again.")};
const render=()=>{
  const pg=pages[p];
  $("num").textContent=pg?pg.n:"Cover";
  $("what").textContent=pg?pg.w:"Ready to roll";
  $("dots").innerHTML=pages.map((_,k)=>`<i class="${k===p?'on':''}"></i>`).join('');
  const nx=pages[p+1];
  $("next").textContent=!started?"▶ Start story":nx?"Next page: "+nx.w:"↺ Read it again";
};
$("next").onclick=()=>{
  if(p>=pages.length-1){p=-1;started=false;ended=false;music.pause();birds.pause();stopAuto()}
  if(!started){
    started=true;ended=false;paused=false;$("pause").textContent="Pause";
    $("app").classList.add("playing");
    birds.volume=bv();birds.currentTime=0;birds.play().catch(()=>{});
    setTimeout(()=>playSong(0),1500);
  }
  const first=p<0;p++;render();playPage();
  if(first){if(mode==="timer")schedule();else if(mode==="voice")startVoice()}
  else if(mode==="timer")schedule();
};
$("back").onclick=()=>{if(p>0){p--;if(mode==="timer")schedule();if(mode==="voice"&&!listening)startVoice();if(ended){ended=false;music.play().catch(()=>{});fade(music,mv(),1500);birds.play().catch(()=>{});fade(birds,bv(),1500);$("app").classList.add("playing");showSong()}render();playPage()}};
$("again").onclick=()=>{if(p>=0)playPage()};
$("pause").onclick=()=>{
  if(!started||ended)return;
  paused=!paused;
  if(paused){music.pause();birds.pause();if(mode==="voice")hint("Paused. Not listening.");$("pause").textContent="Play";$("app").classList.remove("playing")}
  else{music.play().catch(()=>{});birds.play().catch(()=>{});$("pause").textContent="Pause";$("app").classList.add("playing");if(mode==="voice"&&listening)hint('<span class="mic"></span>Listening. Read along and the animals will join in.')}
};
$("animals").innerHTML=buttons.map(([k,e,n])=>`<button data-k="${k}"><span>${e}</span>${n}</button>`).join('');
$("animals").onclick=ev=>{const b=ev.target.closest("button");if(!b)return;const k=b.dataset.k;sfx(k,0);duckMusic(S[k].max);b.classList.add("hit");setTimeout(()=>b.classList.remove("hit"),S[k].max*1000)};
$("mvol").oninput=()=>{if(!paused&&!ended)music.volume=mv()};
$("bvol").oninput=()=>{birds.volume=bv()};
render();
}
</script>
</body>
</html>
